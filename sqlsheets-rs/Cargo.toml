[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/gui"]
default-members = ["crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Port of SqlSheets by alexanderdfox"]
description = "SQLite + Spreadsheet + Formulas — Rust TUI & GUI port of SqlSheets"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
csv = "1.3"
regex = "1"
once_cell = "1"
rhai = { version = "1.16", default-features = false, features = ["std", "sync"] }
